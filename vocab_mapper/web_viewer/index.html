<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vocabulary Map Generator</title>
    <link rel="icon" href="/assets/bookspine-logo.ico">
    <link rel="stylesheet" href="/style.css">
  </head>
  <body class="page-shell">
    <header class="app-head">
      <a class="app-title" href="/">Vocabulary Maps</a>
      <button id="menuButton" class="menu-button" type="button" aria-expanded="false" aria-controls="navMenu" aria-label="Open navigation">&#9776;</button>
      <nav id="navMenu" class="nav-menu" aria-label="Navigation">
        <a href="/">Upload</a>
        <a href="/viewer.html">Map Viewer</a>
        <a href="/word-stats.html">Word Stats</a>
        <a href="/manage-maps.html">Manage Maps</a>
      </nav>
    </header>
    <main class="upload-page">
      <div class="upload-content">
        <aside class="upload-brand" aria-label="Bookspine logo">
          <img src="/assets/bookspine-logo.svg" alt="Bookspine" class="upload-logo">
        </aside>
        <section class="upload-workspace" aria-label="Generate vocabulary maps">
          <div id="dropZone" class="drop-zone large-drop" tabindex="0">
            <input id="fileInput" type="file" accept=".txt,text/plain" hidden>
            <button id="chooseFile" type="button">Choose .txt</button>
            <span id="fileName" class="file-name">No file selected</span>
          </div>
          <div class="form-grid">
            <label class="field stacked">
              <span>Corpus</span>
              <select id="corpusSelect"></select>
            </label>
            <label class="field stacked map-multi-field">
              <span>Maps</span>
              <select id="metricSelect" multiple size="10"></select>
            </label>
            <label class="field stacked">
              <span>Width</span>
              <input id="mapWidth" type="number" min="200" max="8000" step="100" value="2000">
            </label>
            <label class="field stacked">
              <span>Scale</span>
              <select id="mapScale">
                <option value="linear">Linear</option>
                <option value="log">Log</option>
              </select>
            </label>
            <label class="field stacked">
              <span>Publication year</span>
              <input id="publicationYear" type="number" min="1" max="9999" step="1" inputmode="numeric">
            </label>
          </div>
          <div class="action-row">
            <button id="generateMaps" type="button">Generate</button>
            <span id="generationStatus" class="generation-status"></span>
          </div>
          <div id="generationResults" class="generation-results" aria-live="polite"></div>
        </section>
      </div>
    </main>
    <script src="/nav.js"></script>
    <script src="/upload.js"></script>
  </body>
</html>
